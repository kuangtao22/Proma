name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: true
        default: 'feat/lan-bridge-mobile'

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test stable directory helper
        run: bun test apps/electron/src/main/lib/stable-directory-native-host.test.ts apps/electron/scripts/build-stable-directory-native.test.ts

      - name: Test utility process lifecycle
        run: >-
          bun test
          apps/electron/src/main/lib/utility-process-startup.test.ts
          apps/electron/src/main/lib/utility-process-lifecycle.test.ts
          apps/electron/src/main/lib/agent-runtime-client-lifecycle.test.ts
          apps/electron/src/main/lib/terminal-runtime-client-lifecycle.test.ts

      # 源码检查与 smoke 构建需要 workspace/dev 链接；裁剪依赖必须最后执行。
      - name: Build Electron and native PTY
        run: bun run build && bun run build:mobile && bun run rebuild:node-pty
        working-directory: apps/electron

      - name: Smoke test native utility processes and PTY
        run: bun run scripts/upstream-runtime-smoke.ts
        working-directory: apps/electron

      - name: Smoke test fresh and existing configuration startup
        run: bun run scripts/first-startup-smoke.cjs
        working-directory: apps/electron

      # 与 package:prepare:win 的最后两步一致，验收后才整理实际安装包依赖。
      - name: Prepare production runtime dependencies
        run: bun install --frozen-lockfile --os=win32 --cpu=x64 && bun run sync:runtime-deps --target-platform=win32 --target-arch=x64
        working-directory: apps/electron

      - name: Package (Windows)
        run: bun run builder --win --x64 --publish never
        working-directory: apps/electron

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Proma-win-x64
          path: apps/electron/out/*.exe
