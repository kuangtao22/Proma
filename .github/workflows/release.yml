# GitHub Actions: 自动打包分发
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 macOS、Windows 和 Linux 产物并发布到 GitHub Releases
#
# 所需 GitHub Secrets（macOS 签名/公证，可选）:
# - MAC_CERTS: Base64 编码的 macOS Developer ID Application 证书 (.p12)
# - MAC_CERTS_PASSWORD: 证书密码
# - APPLE_ID: Apple ID（公证用）
# - APPLE_APP_SPECIFIC_PASSWORD: App-Specific 密码（公证用）
# - APPLE_TEAM_ID: Apple Developer Team ID
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate-release:
    name: validate Bone release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      upstream_version: ${{ steps.release.outputs.upstream_version }}
      bone_build: ${{ steps.release.outputs.bone_build }}
      release_title: ${{ steps.release.outputs.release_title }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 校验 Bone 发布版本
        id: release
        run: bun run apps/electron/scripts/validate-release-version.ts

  build-mac-arm64:
    name: build (macos-latest, mac, arm64)
    runs-on: macos-latest
    needs: [validate-release]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # macOS 代码签名准备（需要配置 MAC_CERTS / MAC_CERTS_PASSWORD secrets，未配置则跳过签名）
      - name: 导入 macOS 签名证书
        if: ${{ env.MAC_CERTS != '' }}
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 准备 Electron 打包资源
        run: bun run --filter='@proma/electron' package:prepare

      - name: 打包 (macOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            if npx electron-builder --mac --arm64 --publish never; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

          echo "macOS ARM64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: apps/electron/out/*
          retention-days: 1

  build-mac-x64:
    name: build (macos-15-intel, mac, x64)
    runs-on: macos-15-intel
    needs: [validate-release]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 导入 macOS 签名证书
        if: ${{ env.MAC_CERTS != '' }}
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 准备 Electron 打包资源
        run: bun run --filter='@proma/electron' package:prepare

      - name: 打包 (macOS x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for i in 1 2 3; do
            if npx electron-builder --mac --x64 --publish never; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 15s..."
              sleep 15
            fi
          done

          echo "macOS x64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mac-x64
          path: apps/electron/out/*
          retention-days: 1

  build-windows-x64:
    name: build (windows-latest, win, x64)
    runs-on: windows-latest
    needs: [validate-release]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 准备 Electron 打包资源
        run: bun run --filter='@proma/electron' package:prepare

      - name: 打包 (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish never
        working-directory: apps/electron

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: apps/electron/out/*
          retention-days: 1

  build-linux-x64:
    name: build (ubuntu-latest, linux, x64)
    runs-on: ubuntu-latest
    needs: [validate-release]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 准备 Electron 打包资源
        run: bun run --filter='@proma/electron' package:prepare

      - name: 打包 (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --linux AppImage deb --x64 --publish never
        working-directory: apps/electron

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: apps/electron/out/*
          retention-days: 1

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release, build-mac-arm64, build-mac-x64, build-windows-x64, build-linux-x64]
    if: >-
      always() && !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.build-mac-arm64.result == 'success' &&
      needs.build-mac-x64.result == 'success' &&
      needs.build-windows-x64.result == 'success' &&
      needs.build-linux-x64.result == 'success'

    steps:
      - name: 下载 Mac arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: out/mac-arm64

      - name: 下载 Mac x64 产物
        uses: actions/download-artifact@v4
        with:
          name: mac-x64
          path: out/mac-x64

      - name: 下载 Windows x64 产物
        uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: out/win-x64

      - name: 下载 Linux x64 产物
        uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: out/linux-x64

      - name: 列出产物
        run: find out -type f | head -50

      - name: 合并自动更新元数据
        shell: bash
        run: |
          ruby -ryaml <<'RUBY'
          arm = YAML.load_file('out/mac-arm64/latest-mac.yml')
          intel = YAML.load_file('out/mac-x64/latest-mac.yml')
          raise 'macOS 更新元数据版本不一致' unless arm['version'] == intel['version']

          files = (arm.fetch('files') + intel.fetch('files')).uniq { |file| file.fetch('url') }
          preferred = files.find { |file| file.fetch('url').include?('arm64') && file.fetch('url').end_with?('.zip') }
          preferred ||= files.find { |file| file.fetch('url').end_with?('.zip') }
          raise 'macOS 更新元数据缺少 ZIP 产物' unless preferred

          merged = arm.merge(
            'files' => files,
            'path' => preferred.fetch('url'),
            'sha512' => preferred.fetch('sha512'),
          )
          File.write('out/latest-mac.yml', YAML.dump(merged))
          RUBY

          mkdir -p out/release-assets
          find out/mac-arm64 out/mac-x64 out/win-x64 out/linux-x64 -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' -o -name 'latest.yml' -o -name 'latest-linux.yml' \) \
            -exec cp {} out/release-assets/ \;
          cp out/latest-mac.yml out/release-assets/latest-mac.yml
          find out/release-assets -maxdepth 1 -type f -print

      - name: 创建 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: ${{ needs.validate-release.outputs.release_title }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            out/release-assets/* \
            || gh release upload "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber \
              out/release-assets/*
