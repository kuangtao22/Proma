<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DutyDeck</title>
    <style>
      /*
       * DutyDeck 启动页：纯 CSS，不依赖任何构建产物或外部字体。
       * 视觉基线是应用图标（纯黑 squircle + 单色条），所以整页只用中性灰阶：
       * 深色渐变加一层极淡的白色辉光，进度条也是白色；不使用彩色，
       * 也不使用任何上游插画或摄影素材。
       */
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background:
          radial-gradient(620px 420px at 50% 44%, rgba(255, 255, 255, 0.07), transparent 68%),
          linear-gradient(168deg, #0e1418 0%, #0b0d10 58%, #0a0c0f 100%);
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .content {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 32px;
        text-align: center;
      }
      .icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      }
      .wordmark {
        margin: 26px 0 0;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .slogan {
        margin: 12px 0 0;
        max-width: 300px;
        font-size: 13px;
        font-weight: 400;
        line-height: 1.7;
        color: rgba(241, 245, 249, 0.62);
      }
      .progress {
        width: 132px;
        height: 3px;
        margin-top: 34px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(241, 245, 249, 0.12);
      }
      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: #f1f5f9;
        animation: slide 1.5s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      }
      .status {
        margin: 14px 0 0;
        font-size: 12px;
        letter-spacing: 0.24em;
        color: rgba(241, 245, 249, 0.42);
      }
      .version {
        position: absolute;
        bottom: 26px;
        margin: 0;
        font-size: 10px;
        letter-spacing: 0.28em;
        color: rgba(241, 245, 249, 0.28);
      }
      @keyframes slide {
        0% { transform: translateX(-105%); }
        100% { transform: translateX(240%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress::after { animation: none; width: 60%; }
      }
    </style>
  </head>
  <body>
    <main class="content" aria-busy="true" aria-live="polite">
      <img class="icon" src="dutydeck-icon.png" alt="" />
      <h1 class="wordmark">DutyDeck</h1>
      <p class="slogan">本地优先的工程工作台 · 画布 · 运维 · 接口 · Agent</p>
      <div class="progress"></div>
      <p class="status">正在启动</p>
      <p class="version">ON DUTY</p>
    </main>
  </body>
</html>
