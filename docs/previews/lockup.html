<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DutyDeck 锁标构图</title>
    <style>
      /*
       * DutyDeck 锁标构图（mark + 字标 + 定位语）。
       * 只是本地预览页，不参与打包；字体用系统栈，不引入任何外部依赖。
       * 品牌色：底板 #151515、字色 #F1F1F1；mark 用单色白版（与托盘/启动页同源）。
       */
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 56px 64px 80px;
        background: #101317;
        color: #f1f1f1;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .page-title { margin: 0 0 36px; font-size: 12px; letter-spacing: 0.32em; color: rgba(241,241,241,.38); }

      /* ── 主构图 ─────────────────────────────────────────── */
      .hero {
        position: relative;
        overflow: hidden;
        padding: 104px 96px;
        border: 1px solid rgba(241,241,241,.08);
        border-radius: 20px;
        background:
          radial-gradient(680px 420px at 16% 26%, rgba(241,241,241,.07), transparent 62%),
          linear-gradient(168deg, #151515 0%, #111417 62%, #0e1013 100%);
      }
      .lockup { position: relative; display: flex; align-items: center; gap: 30px; }
      .lockup img { width: 76px; height: 76px; }
      .wordmark { margin: 0; font-size: 46px; font-weight: 600; letter-spacing: -0.022em; line-height: 1; }
      .positioning { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: rgba(241,241,241,.64); letter-spacing: .01em; }
      .pillars { margin: 10px 0 0; font-size: 11px; letter-spacing: .26em; color: rgba(241,241,241,.4); }
      .divider { height: 1px; margin: 56px 0 0; background: rgba(241,241,241,.09); }
      .meta {
        display: flex; justify-content: space-between; align-items: baseline;
        margin-top: 18px; font-size: 10px; letter-spacing: .3em; color: rgba(241,241,241,.34);
      }

      /* ── 尺寸检验与变体 ─────────────────────────────────── */
      h2 { margin: 64px 0 18px; font-size: 12px; letter-spacing: .24em; color: rgba(241,241,241,.42); }
      .row { display: flex; align-items: flex-end; gap: 56px; flex-wrap: wrap; }
      .mini { display: flex; align-items: center; gap: 14px; }
      .mini img { display: block; }
      .mini span { font-weight: 600; letter-spacing: -0.02em; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .stack .word { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
      .tile { display: inline-flex; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 22px; background: #151515; }
      .tile img { width: 96px; height: 96px; border-radius: 22px; }
      .swatches { display: flex; gap: 14px; margin-top: 6px; }
      .swatch { width: 108px; }
      .swatch .chip { height: 56px; border-radius: 10px; border: 1px solid rgba(241,241,241,.1); }
      .swatch p { margin: 8px 0 0; font-size: 10px; letter-spacing: .12em; color: rgba(241,241,241,.45); }
    </style>
  </head>
  <body>
    <p class="page-title">DUTYDECK · LOCKUP</p>

    <!-- 主构图：横向锁标 -->
    <section class="hero">
      <div class="lockup">
        <img src="../../apps/electron/resources/startup-splash/dutydeck-mark-white.png" alt="DutyDeck" />
        <div>
          <h1 class="wordmark">DutyDeck</h1>
          <p class="positioning">本地优先的工程工作台</p>
          <p class="pillars">画布 · 运维 · 接口 · Agent</p>
        </div>
      </div>
      <div class="divider"></div>
      <div class="meta">
        <span>ON DUTY</span>
        <span>v0.19.53-bone.10</span>
      </div>
    </section>

    <h2>同一构图的三种尺寸</h2>
    <div class="row">
      <div class="mini" style="gap:22px">
        <img src="../../apps/electron/resources/startup-splash/dutydeck-mark-white.png" width="52" height="52" alt="" />
        <span style="font-size:32px">DutyDeck</span>
      </div>
      <div class="mini">
        <img src="../../apps/electron/resources/startup-splash/dutydeck-mark-white.png" width="30" height="30" alt="" />
        <span style="font-size:19px">DutyDeck</span>
      </div>
      <div class="mini" style="gap:8px">
        <img src="../../apps/electron/resources/startup-splash/dutydeck-mark-white.png" width="18" height="18" alt="" />
        <span style="font-size:11px">DutyDeck</span>
      </div>
    </div>

    <h2>竖排变体（窄容器 / 启动页）</h2>
    <div class="row">
      <div class="stack">
        <img src="../../apps/electron/resources/startup-splash/dutydeck-mark-white.png" width="64" height="64" alt="" />
        <span class="word">DutyDeck</span>
      </div>
      <div class="stack">
        <span class="tile"><img src="../../apps/electron/resources/icon.png" alt="" /></span>
        <span class="word">DutyDeck</span>
      </div>
    </div>

    <h2>色板</h2>
    <div class="swatches">
      <div class="swatch"><div class="chip" style="background:#151515"></div><p>#151515 底板</p></div>
      <div class="swatch"><div class="chip" style="background:#F1F1F1"></div><p>#F1F1F1 字形</p></div>
      <div class="swatch"><div class="chip" style="background:linear-gradient(135deg,rgba(241,241,241,0),#ffffff)"></div><p>左上 0% → 右下纯白</p></div>
    </div>
  </body>
</html>
